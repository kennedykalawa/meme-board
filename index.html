<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Board</title>
    <link rel="stylesheet" href="./meme.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>
<body>
    <section class="section1">
        <div class="hero">
           <h2>Welcome to the meme generator</h2>
           <p>Copy the image link of your meme and we will generate it for you 😉</p>
           <p>This is gonna be fun 😁 let's put laughter to others!</p>
           <span class="signature">by ktec</span>
        </div>
        
        <div class="template-gallery">
            <img src="https://i.imgflip.com/1bij.jpg" alt="Success Kid" class="template-thumb" data-url="https://i.imgflip.com/1bij.jpg">
            <img src="https://i.imgflip.com/1ur9b0.jpg" alt="Distracted Boyfriend" class="template-thumb" data-url="https://i.imgflip.com/1ur9b0.jpg">
            <img src="https://i.imgflip.com/30b1gx.jpg" alt="Drake" class="template-thumb" data-url="https://i.imgflip.com/30b1gx.jpg">
            <img src="https://i.imgflip.com/9ehk.jpg" alt="One Does Not Simply" class="template-thumb" data-url="https://i.imgflip.com/9ehk.jpg">
        </div>

        <form id="meme-form">
            <div class="input-group">
                <label for="image-link">Image URL</label>
                <input type="url" id="image-link" placeholder="https://example.com/meme.png" required>
                
                <label for="top-text">Top Text</label>
                <input type="text" id="top-text" placeholder="A custom meme...">
                
                <label for="bottom-text">Bottom Text</label>
                <input type="text" id="bottom-text" placeholder="is the best kind">
            </div>
            <div class="button-container">
                <button type="submit" class="btn">Generate Me</button>
            </div>
        </form>
    </section>
    <section id="meme-output"></section>
    <script src="./meme.js"></script>
</body>
</html>
